<html>
    <head>
        <title> CSS Grid</title>
        <style>
            .h1{
                text-align: center;
            }
            .parent{
                background-color: aqua;
                display: grid;
                grid-template-columns: auto auto auto;
                padding: 5px;
                gap: 5px;
            }
            .parent div{
                background-color: lemonchiffon;
                padding: 10px;
                height: 50px;
                width: 50px;
            }
        </style>
    </head>
    <body>
        <h1> CSS Grid </h1>
        <div class="parent">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>

        </div>
    </body>
</html>
