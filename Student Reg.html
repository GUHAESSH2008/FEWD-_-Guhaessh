<html>
    <head>
        <title> Student Registration Form </title>
        <style>
           form{
            border: 1px solid black;
            width: 400px;
            margin-left: 700px;
            padding-left: 40px;
            margin-top: 250px;
            border-radius: 10px;
            box-shadow: 2px 4px 8px black;
            background-color: rgb(13, 212, 199);
           }
           #i1{
            margin-left: 70px;
           }
            #i2{
            margin-left: 6px;
           }
            #i3{
            margin-left: 70px;
           }
            #i4{
            margin-left: 63px;
           }
            #i5{
            margin-left: 20px;
           }
            #i6{
            margin-left: 45px;
           }
            #i7{
            margin-left: 55px;
           }
           #b1{
            margin-left: 70px;
            margin-bottom: 20px;
            background-color: rgb(70, 197, 28);
            border-radius: 10px;
            box-shadow: 2px 4px 8px;
           }
           #b2{
            margin-left: 50px;
            background-color: chocolate;
            border-radius: 10px;
            box-shadow: 2px 4px 8px;
           }
           #l1{
            margin-left: 40px;
           }
           #l2{
            margin-left: 40px;
           }
           #l3{
            margin-left: 40px;
           }
           #l4{
            margin-left: 40px;
           }
           #l5{
            margin-left: 40px;
           }
           #l6{
            margin-left: 40px;
           }
           #l7{
            margin-left: 40px;
           }
           #l8{
            margin-left: 40px;
           }
        </style>
    </head>
    <body>
        <form>
            <h1>Student Registration Form </h1>
            <label id="l1"> Name: </label>
            <input id="i1" type="text" placeholder="Enter Name"><br><br>
            <label id="l2"> Registration.No: </label>
            <input id="i2" type="number" placeholder="Enter Registration Number"><br><br>
            <label id="l3"> Email: </label>
            <input id="i3" type="email" placeholder="Enter Email"><br><br>
            <label id="l4"> Course: </label>
            <input id="i4" type="text" placeholder="Enter Course"><br><br>

            <label id="l7"> Gender: </label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female
            <input type="radio" name="Gender">Others<br><br>
            <label id="l8"> Address: </label>
            <textarea id="i7" type="text" placeholder="Enter Address"></textarea><br><br>
            <button id="b1">Submit</button>
            <button id="b2">Reset</button>
        </form>
    </body>
</html>
