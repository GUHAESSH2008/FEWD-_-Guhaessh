<html>
<head>
    <title>College Event</title>
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    text-align: center;
}

h1 {
    background-color: navy;
    color: white;
    padding: 20px;
    margin: 0;
}

.event {
    background-color: white;
    width: 80%;
    margin: 20px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 5px gray;
}

h2 {
    color: navy;
}

p {
    font-size: 16px;
}

button {
    background-color: blue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
}

</style>

<body>

    <h1>College Event 2026</h1>

    <div class="event">
        <h2>Annual College Fest</h2>

        <p>Welcome to our college annual fest!</p>

        <p><b>Date:</b> 10 October 2026</p>
        <p><b>Time:</b> 10:00 AM</p>
        <p><b>Venue:</b> College Auditorium</p>

        <button>Register Now</button>
    </div>

    <div class="event">
        <h2>Events</h2>

        <p>Singing Competition</p>
        <p>Dance Competition</p>
        <p>Coding Competition</p>
        <p>Quiz Competition</p>
    </div>

</body>
</html>
